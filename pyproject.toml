[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-tagger"
version = "0.1.0"
description = "Two-stage multimodal tagger for Anima/Danbooru LoRA datasets"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.6",
  "llama-cpp-python>=0.3.32",
  "openai>=1.0",
  "Pillow>=10.0",
  "psutil>=5.9",
  "nvidia-ml-py>=12.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
anima-tagger = "anima_tagger.app:main"
anima-tagger-cli = "anima_tagger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anima_tagger = ["prompts/*.txt", "resources/*.txt", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
